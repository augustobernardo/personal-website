version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the runtime pinned in .nvmrc (Node 24); a major jump is a deliberate upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    # Scanner images live outside .github/: Dependabot cannot open PRs that change files there.
    directories: ["/", "/tools/ci/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      # Build image follows .nvmrc (Node 24); a new major is a deliberate upgrade.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
