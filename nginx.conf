server_tokens off;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
gzip_vary on;
gzip_min_length 1024;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: no internal port or forged Host in redirects.
    absolute_redirect off;

    # add_header is not inherited into a location that declares its own,
    # so every location includes the shared headers explicitly.
    include /etc/nginx/security-headers.conf;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # ^~ so the regex location below does not take precedence.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(svg|png|jpe?g|webp|avif|ico|pdf|xml|woff2?)$ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Generated at build without a file extension, so set its type explicitly.
    location = /opengraph-image {
        default_type image/png;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }
}
